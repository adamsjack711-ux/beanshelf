name: Beanshelf
options:
  bundleIdPrefix: dev.adamsjack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Beanshelf:
    type: application
    platform: iOS
    sources:
      - Beanshelf
    info:
      path: Beanshelf/Info.plist
      properties:
        CFBundleDisplayName: Beanshelf
        NSCameraUsageDescription: Beanshelf photographs your coffee bags to put them on the shelf and read their labels.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: dev.adamsjack.beanshelf
            CFBundleURLSchemes: [beanshelf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adamsjack.beanshelf
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.9"
